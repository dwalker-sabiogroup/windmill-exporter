name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
permissions: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  checks:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
      - name: Check module consistency
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Format and lint
        run: |
          golangci-lint fmt
          git diff --exit-code
          golangci-lint run
      - name: Race tests, vet, build and vulnerabilities
        run: |
          go test -race ./...
          go vet ./...
          go build -trimpath -o /tmp/windmill-exporter ./cmd/windmill-exporter
          govulncheck ./...
      - name: Validate Kubernetes example
        run: kubeconform -strict -summary -kubernetes-version 1.34.0 deploy/kubernetes.yaml
  image:
    name: AMD64 image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image without publishing credentials
        env:
          IMAGE_VERSION: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 --build-arg VERSION="$IMAGE_VERSION" --build-arg REVISION="$COMMIT_SHA" -t windmill-exporter:ci .
          test "$(docker inspect --format '{{.Os}}/{{.Architecture}}' windmill-exporter:ci)" = linux/amd64
          test "$(docker inspect --format '{{.Config.User}}' windmill-exporter:ci)" = 65532:65532
      - name: Container liveness and shutdown
        shell: bash
        run: |
          container="$(docker run -d --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:9108:9108 -e WINDMILL_URL=http://127.0.0.1:1 -e WINDMILL_COLLECTORS=health_status windmill-exporter:ci)"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 1 http://127.0.0.1:9108/healthz
          for path in readyz livez; do
            curl --fail --silent --show-error "http://127.0.0.1:9108/$path"
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:9108/debug/pprof/)" = 404
          docker stop --time 30 "$container"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0
      - name: Save validated release image
        if: startsWith(github.ref, 'refs/tags/')
        run: docker save --output /tmp/windmill-exporter-image.tar windmill-exporter:ci
      - name: Transfer release image
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-image
          path: /tmp/windmill-exporter-image.tar
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
  security:
    name: Workflow security
    uses: $/.github/workflows/zizmor.yaml
    permissions:
      actions: read # Allows the called zizmor workflow to inspect action metadata.
      contents: read