apiVersion: v1
kind: ServiceAccount
metadata:
  name: windmill-exporter
  labels:
    app.kubernetes.io/name: windmill-exporter
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: windmill-exporter
  labels:
    app.kubernetes.io/name: windmill-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: windmill-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: windmill-exporter
    spec:
      serviceAccountName: windmill-exporter
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: ghcr.io/dwalker-sabiogroup/windmill-exporter:VERSION
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-metrics
              containerPort: 9108
              protocol: TCP
          env:
            - name: WINDMILL_URL
              value: http://windmill:8000
            - name: WINDMILL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: windmill-exporter-token
                  key: token
            - name: EXPORTER_DRAIN_DELAY
              value: 5s
            - name: EXPORTER_SHUTDOWN_TIMEOUT
              value: 20s
            - name: OTEL_SERVICE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OTEL_SERVICE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GOMEMLIMIT
              value: 96MiB
          startupProbe:
            httpGet:
              path: /startupz
              port: http-metrics
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-metrics
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /livez
              port: http-metrics
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: windmill-exporter
  labels:
    app.kubernetes.io/name: windmill-exporter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: windmill-exporter
  ports:
    - name: http-metrics
      port: 9108
      targetPort: http-metrics
      protocol: TCP